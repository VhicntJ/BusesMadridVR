# Verificación de seguridad automática
name: Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for secrets in code
      run: |
        echo "🔍 Verificando que no haya secrets en el código..."

        # Verificar que .env no esté en el repo
        if git ls-files | grep -E "^\.env$"; then
          echo "❌ ERROR: Archivo .env encontrado en el repositorio"
          exit 1
        fi

        # Verificar que no haya passwords hardcoded reales
        # Excluir: useState, process.env, getRequiredEnv, labels HTML
        SUSPICIOUS=$(grep -r -iE "(password|secret|api[_-]?key)\s*[:=]\s*['\"][a-zA-Z0-9]{8,}['\"]" src/ \
          --include="*.ts" --include="*.tsx" --include="*.js" \
          | grep -v "process.env" \
          | grep -v "useState" \
          | grep -v "getRequiredEnv" \
          | grep -v "htmlFor" \
          | grep -v "placeholder" \
          | grep -v "type=" \
          | grep -v "name=" \
          | grep -v "id=" \
          | grep -v "className=" \
          || true)

        if [ -n "$SUSPICIOUS" ]; then
          echo "⚠️  ADVERTENCIA: Posibles secrets encontrados:"
          echo "$SUSPICIOUS"
          echo ""
          echo "Si estos NO son secrets reales, ignora esta advertencia."
          # No fallar el build por ahora, solo advertir
          # exit 1
        fi

        echo "✅ No se encontraron secrets hardcoded"

    - name: Verify .gitignore
      run: |
        echo "🔍 Verificando .gitignore..."

        if ! grep -q "^\.env" .gitignore; then
          echo "❌ ERROR: .env no está en .gitignore"
          exit 1
        fi

        if ! grep -q "\.sql" .gitignore; then
          echo "⚠️  ADVERTENCIA: *.sql no está en .gitignore"
        fi

        echo "✅ .gitignore verificado"

    - name: Check dependencies
      run: |
        echo "🔍 Verificando dependencias..."
        npm install
        npm audit --audit-level=high
        echo "✅ Dependencias verificadas"
